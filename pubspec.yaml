  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - Assets/authentication/
    - Assets/icons/    
    - Assets/logo/
    - Assets/Images/
    - Assets/Images/Sign_In_Screen/
    - Assets/Images/Sign_Up_Screen/
    - Assets/Images/home/
    - Assets/translations/
    - Assets/jsons/
